name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same Node version as the Docker build (Dockerfile)
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint
      - run: npm test
      # The first download stays small: no sentences in it, under the budget
      - run: npm run build
      - run: npm run check:bundle
